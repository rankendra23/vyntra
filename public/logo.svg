<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="sphereGrad" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="30" y1="30" x2="70" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Outer Sphere Ring -->
  <circle cx="50" cy="50" r="42" stroke="url(#sphereGrad)" stroke-width="7" stroke-dasharray="190 70" stroke-linecap="round"/>
  <!-- Central Focus Circle / Lens -->
  <circle cx="50" cy="50" r="24" fill="url(#sphereGrad)"/>
  <circle cx="50" cy="50" r="20" fill="#ffffff" fill-opacity="0.2"/>
  <circle cx="44" cy="44" r="7" fill="white" fill-opacity="0.75"/>
  <!-- Connecting satellite dots -->
  <circle cx="20" cy="30" r="5" fill="#06b6d4"/>
  <circle cx="82" cy="68" r="4.5" fill="#2563eb"/>
  <circle cx="75" cy="22" r="3.5" fill="#0d9488"/>
</svg>
